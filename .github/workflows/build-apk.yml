name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter version
        run: flutter --version

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test

      - name: build apk (release, per-abi)
        # 只出 arm64-v8a + armeabi-v7a（GeckoView 内核体积大；x86_64 模拟器用户忽略不计，仍用 v1.0.5 老包）
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --no-pub

      - name: rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.+)-release\.apk/\1/')
            cp "$f" "baibaoxiang-$abi.apk"
          done
          ls -la

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: baibaoxiang-apk
          path: build/app/outputs/flutter-apk/baibaoxiang-*.apk
          if-no-files-found: error
